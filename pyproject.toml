[project]
name = "daphne-hrv"
version = "0.4.0"
description = "2VV Daphne HRV Home Assistant custom integration"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.8",
    "pymodbus>=3.11.1,<4.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
# Pin the target explicitly: HA 2026.8 requires Python 3.14.2+.
target-version = "py314"

[tool.ruff.lint]
# State the rule set explicitly. Ruff's implicit defaults have changed between
# releases (0.16 enabled RUF/TRY/BLE/... on top of the historical E,F set),
# which silently redefines the lint gate on upgrade. Pin it instead.
select = ["E4", "E7", "E9", "F", "I"]
